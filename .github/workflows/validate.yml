name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  credential-free-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python sources
        # Udacity supplies tests/test_agent.py as an immutable rubric artifact.
        # Keep the CI contract stable across Ruff releases by selecting the
        # core correctness rules explicitly; broader style checks are optional.
        run: >-
          ruff check config.py src infrastructure tests
          --select E4,E7,E9,F
          --exclude tests/test_agent.py

      - name: Compile Python sources
        run: python -m compileall -q config.py src tests

      - name: Validate public repository policy
        run: python -m unittest tests.test_public_repository -v

      - name: Validate secure defaults
        run: python -m unittest tests.test_security_defaults -v

      - name: Run credential-free assignment tests
        run: python tests/run_task2_ci.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentcore/cdk/package-lock.json

      - name: Build and test the AgentCore CDK project
        working-directory: agentcore/cdk
        run: |
          npm ci
          npm run build
          npm test -- --runInBand
